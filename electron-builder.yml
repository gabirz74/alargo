appId: app.alargo.desktop
productName: Alargo
copyright: Copyright © 2026 gabirz74
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
extraResources:
  - from: engine
    to: engine
    filter:
      - '**/*'
      - '!tests/**'
      - '!**/__pycache__/**'
  - from: resources/uv
    to: uv
afterPack: scripts/after-pack.cjs
mac:
  category: public.app-category.music
  target:
    - target: dmg
  icon: build/icon.icns
  identity: null
  hardenedRuntime: false
  artifactName: Alargo-${version}-mac-${arch}.dmg
dmg:
  title: Alargo ${version}
  window:
    width: 540
    height: 360
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: Alargo-Setup-${version}.exe
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Alargo
  deleteAppDataOnUninstall: false
